bundle:
  name: advito-ai-bi

include:
  - resources/*.yml

variables:
  catalog:
    default: "bcd_adv_workspace_poc"
  schema:
    default: "apex"
  warehouse_id:
    default: "5cd3a4956df6152f"

targets:
  bcd:
    workspace:
      host: https://dbc-1e27e56a-90cd.cloud.databricks.com
      profile: bcd-customer
    variables:
      catalog: "bcd_adv_workspace_poc"
      schema: "apex"
    resources:
      apps:
        advito-ai-bi:
          name: advito-ai-bi
          source_code_path: /Workspace/Users/rohit.bhagwat@bcdtravel.com/advito-ai-bi
          config:
            command:
              - "python"
              - "-m"
              - "uvicorn"
              - "app:app"
              - "--host"
              - "0.0.0.0"
              - "--port"
              - "8000"
            env:
              - name: DASHBOARD_URL
                value: "https://dbc-1e27e56a-90cd.cloud.databricks.com/embed/dashboardsv3/01f1271698161d42b3c66528415775e8?o=1048934788948873"
              - name: MULTI_PAGE_DASHBOARD_URL
                value: "https://dbc-1e27e56a-90cd.cloud.databricks.com/embed/dashboardsv3/01f1271698161d42b3c66528415775e8?o=1048934788948873"
              - name: GENIE_SPACE_ID
                value: "01f127092d2219f3be10180d79b2ee5d"
              - name: WAREHOUSE_ID
                value: "5cd3a4956df6152f"
              - name: MAS_ENDPOINT
                value: "https://dbc-1e27e56a-90cd.cloud.databricks.com/serving-endpoints/mas-d4bc5d36-endpoint/invocations"
              - name: GENIE_MCP_POLL_INTERVAL_MS
                value: "3000"
              - name: GENIE_MCP_POLL_MAX_ATTEMPTS
                value: "120"
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: "5cd3a4956df6152f"
                permission: CAN_USE
            - name: mas-endpoint
              serving_endpoint:
                name: "mas-d4bc5d36-endpoint"
                permission: CAN_QUERY
          user_api_scopes:
            - sql
            - genie

sync:
  include:
    - "app.py"
    - "app.yaml"
    - "requirements.txt"
    - "server/**"
    - "frontend/dist/**"
