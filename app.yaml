command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DASHBOARD_URL
    value: "https://dbc-1e27e56a-90cd.cloud.databricks.com/embed/dashboardsv3/01f1271698161d42b3c66528415775e8?o=1048934788948873"
  - name: MULTI_PAGE_DASHBOARD_URL
    value: "https://dbc-1e27e56a-90cd.cloud.databricks.com/embed/dashboardsv3/01f1271698161d42b3c66528415775e8?o=1048934788948873"
  - name: GENIE_SPACE_ID
    value: "01f127092d2219f3be10180d79b2ee5d"
  - name: WAREHOUSE_ID
    value: "5cd3a4956df6152f"

  # Managed Genie MCP server polling (Genie agent turns take ~70-260s).
  - name: GENIE_MCP_POLL_INTERVAL_MS
    value: "3000"
  - name: GENIE_MCP_POLL_MAX_ATTEMPTS
    value: "120"

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "5cd3a4956df6152f"
      permission: CAN_USE

user_api_scopes:
  - sql
  - genie
